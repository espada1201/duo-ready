name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is switched on once in Settings > Pages > Source: GitHub Actions; until then this skips.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 while Pages is off; "Deploy from a branch" has another build_type and doesn't take this upload.
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pages" | grep -q '"build_type": *"workflow"'; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "::notice::GitHub Pages is off. Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow."; fi
      - if: steps.pages.outputs.on
        uses: actions/checkout@v4
      - if: steps.pages.outputs.on
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.pages.outputs.on
        run: npm ci && npx vite build
      - if: steps.pages.outputs.on
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.on
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.pages.outputs.on
        uses: actions/deploy-pages@v4
        id: deployment
